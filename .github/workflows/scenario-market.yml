name: Prepare Scenario Blender market
on:
  push:
    branches: [codex/scenario-market]
    paths:
      - 'tools/prepare/scenario_*'
      - 'tools/prepare/acquire_scenario_assets.mjs'
      - 'tools/vendor/scenario-blender/**'
      - 'tools/scenarios/lagos-market.mjs'
      - 'src/runtime/Studio.ts'
      - 'src/runtime/SequencePlayer.ts'
      - 'src/sim/Simulation.ts'
      - '.github/workflows/scenario-market.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scenario-market
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Acquire actual provider files
        run: node tools/prepare/acquire_scenario_assets.mjs /tmp/kova-scenario-input
      - name: Run the reused Scenario toolkit in Blender
        run: |
          curl -L --fail --retry 2 -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-5.2.1-linux-x64/blender -b --factory-startup --python-exit-code 1 -P tools/prepare/scenario_assets.py -- /tmp/kova-scenario-input /tmp/kova-prepared
          node tools/prepare/scenario_world.mjs /tmp/kova-prepared /tmp/kova-scenario-input
          node tools/prepare/bake_world.mjs /tmp/kova-market-collision.glb public/content/worlds/lagos-market
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise the real world and pointer controls
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          KOVA_VITE_PID=$!
          trap 'kill "$KOVA_VITE_PID" || true' EXIT
          for attempt in $(seq 1 30); do curl -fs http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node tools/studio.mjs tools/scenarios/lagos-market.mjs public/content/worlds/lagos-market/review 'http://127.0.0.1:5173/?world=lagos-market&capture'
          test -s public/content/worlds/lagos-market/review/market-overview.png
          test -s public/content/worlds/lagos-market/review/follow-camera.png
      - name: Preserve prepared content on the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/content/worlds/lagos-market public/content/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare Scenario Blender market assets and verify animated population'
            git push origin HEAD:codex/scenario-market
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-market-review
          path: |
            public/content/worlds/lagos-market/review
            public/content/worlds/lagos-market/blender-report.json
            public/content/worlds/lagos-market/provenance.json
